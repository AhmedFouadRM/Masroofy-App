targets:
  $default:
    builders:
      drift_dev:
        options:
          # Used by `dart run drift_dev make-migrations`: schema snapshots are
          # committed under drift_schemas/ and migration tests under test/drift/.
          databases:
            default: lib/core/database/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
          store_date_time_values_as_text: false
