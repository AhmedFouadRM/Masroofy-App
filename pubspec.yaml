name: masroofy
description: "Masroofy (مصروفي) — Personal expense tracker. Bilingual (AR/EN), offline-first."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Navigation
  go_router: ^17.5.0

  # Local Database
  drift: ^2.25.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol

  # Data Classes & Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Error Handling
  fpdart: ^1.1.0

  # Localization
  easy_localization: ^3.0.7
  intl: ^0.20.2

  # Auth & Security
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.0.0

  # Settings
  shared_preferences: ^2.5.2

  # Charts
  fl_chart: ^1.2.0

  # UI Utilities
  gap: ^3.0.1
  flutter_animate: ^4.5.2

  # Export
  share_plus: ^13.3.0
  csv: ^8.0.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.15
  riverpod_generator: ^4.0.4
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.9.4
  drift_dev: ^2.25.0

  # Linting
  very_good_analysis: ^10.3.0

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
